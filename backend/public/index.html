<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>My Vocabulary Lists</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>📚 My Lists</h1>
    
    <div class="quick-add-box" style="background: #e3f2fd; padding: 15px; border-radius: 8px;">
        <h3>Quick Add to "New Items"</h3>
        <input type="text" id="quickWord" placeholder="Word">
        <input type="text" id="quickMeaning" placeholder="Meaning">
        <button onclick="quickAdd()">Add</button>
    </div>

    <br>
    <button onclick="createList()" class="btn-primary">+ Create New List</button>

    <div id="listContainer">
        </div>

    <script src="js/myList.js"></script>
</body>
</html>
