<!-- backend/public/index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocabulary Memo</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>Vocabulary Memo</h1>

  <section>
    <h2>Add Vocabulary</h2>

    <form id="vocabForm" class="form-grid" onsubmit="return false;">
      
      <label for="title">Word</label>
      <input type="text" id="title" required />

      <label for="content">Meaning</label>
      <input type="text" id="content" />

      <div></div>
      <button type="button" id="saveButton">Save</button>

    </form>

    <p id="result"></p>
  </section>

  <section>
    <div class="list-header">
      <h3>Vocabulary List</h3>
      <button id="generateBtn" onclick="generateMeanings()">
        Generate Meanings
      </button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Word</th>
          <th>Meaning</th>
          <th>Language</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="vocabTableBody"></tbody>
    </table>
  </section>

  <div style="margin-top:40px;">
    <button onclick="logout()">Logout</button>
  </div>

  <script src="main.js"></script>
</body>
</html>
