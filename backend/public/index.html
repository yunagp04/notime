<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>คลังคำศัพท์ทั้งหมด</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My Vocabulary</h1>
    <button onclick="location.href='/list-all.html'">ไปหน้าจัดการกลุ่มคำ (Lists) →</button>

    <section class="add-section">
        <h3>เพิ่มคำศัพท์ใหม่ (บันทึกลงคลัง)</h3>
        <input type="text" id="title" placeholder="คำศัพท์">
        <input type="text" id="content" placeholder="ความหมาย">
        <button onclick="saveVocab()">บันทึก</button>
    </section>

    <table>
        <thead>
            <tr>
                <th>คำศัพท์</th>
                <th>ความหมาย</th>
                <th>จัดการ</th>
            </tr>
        </thead>
        <tbody id="vocabTableBody"></tbody>
    </table>

    <script src="js/vocab-logic.js"></script>
</body>
</html>
