<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Manage Words</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button onclick="location.href='/'">← Back to Lists</button>
    <h2 id="listTitle">Loading List...</h2>

    <section class="add-section">
    <input type="text" id="newWord" placeholder="Word">
    <input type="text" id="newMeaning" placeholder="Meaning">
    <button onclick="addWordToCurrentList()">Add Word</button>
</section>

<div class="actions">
    <button onclick="generateMeanings()" id="genBtn">AI Generate All</button>
    <button onclick="deleteSelected()" class="btn-danger">Delete Selected</button>
</div>

<table>
    <thead>
        <tr>
            <th><input type="checkbox" id="selectAll" onchange="toggleAllCheckboxes(this)"></th>
            <th>Word</th>
            <th>Meaning</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="wordContainer"></tbody>
</table>

    <script src="js/listDetail.js"></script>
</body>
</html>
