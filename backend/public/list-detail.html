<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>รายละเอียดกลุ่มคำ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button onclick="location.href='/list-all.html'">← กลับไปหน้ารวมกลุ่ม</button>
    <h2 id="listTitle">กำลังโหลด...</h2>

    <section class="add-section">
        <h3>Add New Word to this List</h3>
        <input type="text" id="newWordTitle" placeholder="Word (เช่น Apple)">
        <input type="text" id="newWordContent" placeholder="Meaning (หรือปล่อยว่างให้ AI)">
        <button onclick="addNewWordToList()">Add Word</button>
    </section>

    <div class="action-bar">
        <button onclick="runAIBatch()" id="aiBtn">🪄 AI เจนความหมายทั้งหมด</button>
        <button onclick="deleteSelected()" style="background-color: #ff4d4d; color: white;">ลบที่เลือก</button>
    </div>

    <table>
        <thead>
            <tr>
                <th class="col-chk">
                    <input type="checkbox" id="selectAll" onchange="toggleAll(this)">
                </th>
                <th class="title-cell">คำศัพท์</th>
                <th class="content-cell">ความหมาย (AI)</th>
                <th class="col-action">จัดการ</th>
            </tr>
        </thead>
        <tbody id="wordTableBody"></tbody>
    </table>

    <script src="js/list-detail-logic.js"></script>
</body>
</html>
